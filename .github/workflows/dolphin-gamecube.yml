# Prove Dolphin builds for TwinPlay's GameCube core.
# macOS: ARM64 JIT, Metal, Vulkan via Dolphin's bundled MoltenVK.
# iOS:   ARM64 cached interpreter (ENABLE_GENERIC), Metal, no JIT, no fast-math.
# Signing is off. Nothing is uploaded. No secrets.
name: Dolphin GameCube

on:
  push:
    branches: [gamecube]

# One pair of jobs per branch head. A new push cancels the previous run.
concurrency:
  group: dolphin-gamecube-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dolphin-macos:
    name: macOS arm64 JIT Metal Vulkan
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install cmake ninja pkg-config
      - name: Xcode
        run: |
          # macos-15 has AppleClang 17. The build script relaxes Dolphin's
          # compiler gate; std::jthread still gets -fexperimental-library.
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          clang --version
      - name: Build Dolphin for macOS
        run: bash scripts/build-dolphin.sh macos
      - name: Note
        if: always()
        run: |
          {
            echo "### macOS Dolphin"
            echo "JIT ARM64, Metal, Vulkan/MoltenVK, \`CODE_SIGNING_ALLOWED=NO\`."
            echo "No App Store Connect and no TestFlight upload."
          } >> "$GITHUB_STEP_SUMMARY"

  dolphin-ios:
    name: iOS arm64 cached interpreter Metal
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install cmake ninja pkg-config
      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          clang --version
          xcodebuild -showsdks | grep -E 'iphoneos|macosx' || true
      - name: Build Dolphin for iOS
        run: bash scripts/build-dolphin.sh ios
      - name: Note
        if: always()
        run: |
          {
            echo "### iOS Dolphin"
            echo "Cached interpreter, \`ENABLE_GENERIC\` (no JIT), Metal, dual-core settings in the host, \`-fno-fast-math\`."
            echo "No StikDebug. No upload."
          } >> "$GITHUB_STEP_SUMMARY"

        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: true
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad: every orientation (needed for Split View, Slide Over and Stage Manager windows).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.charlie.dsemu.nds-rom
            UTTypeDescription: DS game image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nds]
          - UTTypeIdentifier: com.charlie.dsemu.gba-rom
            UTTypeDescription: Game Boy Advance game image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gba]
          - UTTypeIdentifier: com.charlie.dsemu.gb-rom
            UTTypeDescription: Game Boy game image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gb]
          - UTTypeIdentifier: com.charlie.dsemu.gbc-rom
            UTTypeDescription: Game Boy Color game image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gbc]
          - UTTypeIdentifier: com.charlie.dsemu.nes-rom
            UTTypeDescription: NES game image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nes]
          - UTTypeIdentifier: com.charlie.dsemu.snes-rom
            UTTypeDescription: Super NES game image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [sfc, smc]
          - UTTypeIdentifier: com.charlie.dsemu.n64-rom
            UTTypeDescription: N64 game image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [n64, z64, v64]
          - UTTypeIdentifier: com.charlie.dsemu.3ds-rom
            UTTypeDescription: 3DS game image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [3ds, cci, cxi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charlie.dsemu
        PRODUCT_NAME: TwinPlay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Violet AppIcon-A2bOcean AppIcon-Fire AppIcon-A2bLime AppIcon-NeonDark AppIcon-ClearGlass AppIcon-Classic AppIcon-Advance AppIcon-Midnight AppIcon-Pixel AppIcon-Crimson AppIcon-Ocean AppIcon-Lime AppIcon-Retro8Gray AppIcon-Retro8Red AppIcon-Retro8Black AppIcon-Retro8White AppIcon-Retro8Blue AppIcon-Retro16Gray AppIcon-Retro16Color AppIcon-Retro16Black AppIcon-Retro16Purple AppIcon-Retro16Teal AppIcon-Analog AppIcon-Clamshell"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1,2"   # #14 iPhone and iPad
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # App Group group.com.charlierodriguez.nduo: shares the widget snapshot with the widget.
        # #19 iCloud container iCloud.com.charlie.dsemu (iCloud Documents): iCloud saves.
        CODE_SIGN_ENTITLEMENTS: Supporting/TwinPlay.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: DSEmu/Bridge/DSEmu-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Core/include"
          - "$(SRCROOT)/Core/src"
          - "$(SRCROOT)/Core/third_party/ares"
          - "$(SRCROOT)/Core/third_party/ares/ares"
          - "$(SRCROOT)/Core/third_party/ares/nall"
          - "$(SRCROOT)/Core/third_party/ares/thirdparty/ymfm/src"
          - "$(SRCROOT)/Core/third_party/ares/no-jit"
          - "$(SRCROOT)/Vendor/rcheevos/include"
        GCC_C_LANGUAGE_STANDARD: gnu11
        OTHER_CPLUSPLUSFLAGS: ["$(OTHER_CFLAGS)", "-fwrapv"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Core/third_party/build"]
        OTHER_LDFLAGS: ["$(inherited)", "-ltwinplay_n64", "-ltwinplay_3ds", "-lc++", "-lz",
                        "-Wl,-exported_symbol,_twinplay_n64_push_samples",
                        "-Wl,-exported_symbol,_twinplay_n64_read_pad",
                        "-Wl,-exported_symbol,_twinplay_n64_store_frame",
                        "-Wl,-exported_symbol,_vkGetInstanceProcAddr",
                        "-Wl,-force_load,$(SRCROOT)/Core/third_party/MoltenVK/MoltenVK/static/MoltenVK.xcframework/$(MVK_SLICE)/libMoltenVK.a",
                        "-Wl,-export_dynamic",
                        "-framework", "Metal",
                        "-framework", "OpenGLES", "-framework", "QuartzCore", "-framework", "Foundation",
                        "-framework", "AVFoundation", "-framework", "IOSurface", "-framework", "AudioToolbox",
                        "-framework", "Security", "-framework", "UIKit"]
        MVK_SLICE: ios-arm64
        "MVK_SLICE[sdk=iphoneos*]": ios-arm64
        "MVK_SLICE[sdk=iphonesimulator*]": ios-arm64_x86_64-simulator
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
      configs:
        Debug:
          # The interpreter is too slow at -O0; keep debug builds optimised.
          GCC_OPTIMIZATION_LEVEL: 3
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "NDEBUG=1"]
        Release:
          GCC_OPTIMIZATION_LEVEL: 3
          LLVM_LTO: YES_THIN       # ~3-4% faster core (headless bench)
  TwinPlayWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"     # AppIntent-configured widgets; the app itself still runs on iOS 16
    sources:
      - path: TwinPlayWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charlie.dsemu.widget
        PRODUCT_NAME: TwinPlayWidget
        INFOPLIST_FILE: TwinPlayWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TwinPlayWidget/TwinPlayWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"   # #14 iPhone and iPad
        SKIP_INSTALL: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  TwinPlayTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: DSEmu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charlie.dsemu.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TwinPlay.app/TwinPlay"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DSEmu:
    build:
      targets:
        DSEmu: all
        TwinPlayTests: [test]
    test:
      config: Debug
      targets:
        - TwinPlayTests
    run:
      config: Debug
      storeKitConfiguration: Supporting/TwinPlay.storekit
